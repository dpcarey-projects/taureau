<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'Étape Rainfall Dashboard</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f3f6f8;color:#18232d}main{max-width:1100px;margin:auto;padding:20px}h1{margin:0 0 4px}.muted{color:#65727d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:white;border-radius:12px;padding:16px;box-shadow:0 1px 5px #0001}.panel{margin-bottom:18px}.label{font-size:.82rem;color:#65727d}.value{font-size:1.7rem;font-weight:700;margin-top:5px}button{border:1px solid #ccd5da;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}button.active{background:#263943;color:white}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e6ebee;text-align:left}th{background:#eef2f4}.right{text-align:right}canvas{width:100%;height:300px;display:block}.error{color:#a33}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>L'Étape Weather & Rainfall</h1><div class="muted">ECCC — station CWPD</div><div id="status" class="muted">Loading live observations…</div>
<div class="cards"><div class="card"><div class="label">Rain — previous hour</div><div id="r1" class="value">—</div></div><div class="card"><div class="label">Rain — previous 24 hours</div><div id="r24" class="value">—</div></div><div class="card"><div class="label">Temperature</div><div id="temp" class="value">—</div></div><div class="card"><div class="label">Wind</div><div id="wind" class="value">—</div></div></div>
<div class="panel"><h2>Rainfall history</h2><div id="buttons" style="display:flex;gap:8px;flex-wrap:wrap"><button data-h="1">1 hour</button><button data-h="6">6 hours</button><button data-h="24" class="active">24 hours</button><button data-h="72">3 days</button><button data-h="168">7 days</button></div><p id="total" class="muted">—</p><canvas id="chart"></canvas></div>
<div class="panel"><h2>Recent observations</h2><table><thead><tr><th>Time</th><th class="right">Rain / 1 hr</th><th class="right">Rain / 24 hr</th><th class="right">Temp.</th><th class="right">Wind</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const API="https://taureau-api.davecareytest.workers.dev/";let data=[],hours=24;
const val=(p,k)=>{let x=p?.[k];return x&&typeof x==="object"&&"value"in x?x.value:x??null};
const num=x=>Number.isFinite(Number(x))?Number(x).toFixed(1):"—";
const time=x=>{let d=new Date(x);return isNaN(d)?x:d.toLocaleString("en-CA",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})};
const wind=p=>{let s=val(p,"wnd_spd_kmh")??val(p,"wnd_spd_pst10mts"),d=val(p,"wnd_dir")??val(p,"dir_of_avg_wnd_10m");return s==null?"—":num(s)+" km/h"+(d?" "+d:"")};
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{hours=+b.dataset.h;document.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
function chart(a){let c=document.getElementById("chart"),W=c.clientWidth||900,H=300,d=devicePixelRatio||1;c.width=W*d;c.height=H*d;let x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);let z=a.map(p=>+val(p,"rnfl_amt_pst1hr")).map(v=>isFinite(v)?v:0),m=Math.max(.5,...z),L=48,T=20,R=15,B=30,iw=W-L-R,ih=H-T-B;x.strokeStyle="#dfe5e8";x.fillStyle="#65727d";x.font="12px system-ui";for(let i=0;i<5;i++){let y=T+ih*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText((m*(1-i/4)).toFixed(1),5,y+4)}let slot=iw/Math.max(z.length,1),bw=Math.max(2,slot*.7);x.fillStyle="#4c8cae";z.forEach((v,i)=>x.fillRect(L+i*slot+(slot-bw)/2,T+ih-v/m*ih,bw,v/m*ih))};
function render(){if(!data.length)return;let a=data.filter(p=>Date.parse(val(p,"date_tm-value"))>=Date.now()-hours*3600000).reverse(),sum=a.reduce((s,p)=>s+(isFinite(+val(p,"rnfl_amt_pst1hr"))?+val(p,"rnfl_amt_pst1hr"):0),0);document.getElementById("total").textContent="Rainfall in selected period: "+sum.toFixed(1)+" mm";chart(a);document.getElementById("rows").innerHTML=data.slice(0,24).map(p=>`<tr><td>${time(val(p,"date_tm-value"))}</td><td class="right">${num(val(p,"rnfl_amt_pst1hr"))} mm</td><td class="right">${num(val(p,"rnfl_amt_pst24hrs"))} mm</td><td class="right">${num(val(p,"air_temp"))} °C</td><td class="right">${wind(p)}</td></tr>`).join("")}
async function load(){try{let r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();data=(j.features||[]).map(x=>x.properties||{});if(!data.length)throw Error("No observations returned");let p=data[0];document.getElementById("r1").textContent=num(val(p,"rnfl_amt_pst1hr"))+" mm";document.getElementById("r24").textContent=num(val(p,"rnfl_amt_pst24hrs"))+" mm";document.getElementById("temp").textContent=num(val(p,"air_temp"))+" °C";document.getElementById("wind").textContent=wind(p);document.getElementById("status").textContent="Updated "+new Date().toLocaleTimeString("en-CA")+" • refreshes every 10 minutes";render()}catch(e){document.getElementById("status").textContent="Feed error: "+e.message;document.getElementById("status").className="error"}}load();setInterval(load,600000);addEventListener("resize",render);
</script></body></html>
