<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'Étape Rainfall Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f3f6f8;color:#18232d}main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;padding:16px;border-radius:12px;margin:12px 0}.value{font-size:1.7rem;font-weight:700}button{padding:7px 12px;margin-right:6px;border:1px solid #ccc;border-radius:7px;background:white}button.active{background:#263943;color:white}canvas{width:100%;height:300px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}@media(max-width:700px){.cards{grid-template-columns:2fr 2fr}}</style></head><body><main><h1>L'Étape Weather & Rainfall</h1><p id="status">Loading…</p><div class="cards"><div class="card">Rain / 1h<div id="r1" class="value">—</div></div><div class="card">Rain / 24h<div id="r24" class="value">—</div></div><div class="card">Temperature<div id="temp" class="value">—</div></div><div class="card">Wind<div id="wind" class="value">—</div></div></div><div class="panel"><h2>Rainfall history</h2><button data-h="1">1h</button><button data-h="6">6h</button><button data-h="24" class="active">24h</button><button data-h="72">3 days</button><button data-h="168">7 days</button><p id="total">—</p><canvas id="chart"></canvas></div><div class="panel"><h2>Recent observations</h2><table><thead><tr><th>Time</th><th class="r">Rain 1h</th><th class="r">Rain 24h</th><th class="r">Temp</th><th class="r">Wind</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const API='https://api.weather.gc.ca/collections/swob-realtime/items?url=CWPD&sortby=-date_tm-value&limit=200&properties='+encodeURIComponent('date_tm-value,air_temp,wnd_spd_kmh,wnd_dir,rnfl_amt_pst1hr,rnfl_amt_pst24hrs')+'&f=json';let data=[],hours=24;
const v=(p,k)=>{let x=p[k];return x&&typeof x==='object'&&'value'in x?x.value:x};const f=x=>Number.isFinite(Number(x))?Number(x).toFixed(1):'—';const tm=x=>new Date(x).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function render(){let cut=Date.now()-hours*3600000,a=data.filter(p=>new Date(v(p,'date_tm-value')).getTime()>=cut).reverse(),vals=a.map(p=>Number(v(p,'rnfl_amt_pst1hr'))).map(x=>isFinite(x)?x:0);document.getElementById('total').textContent='Rainfall in selected period: '+vals.reduce((a,b)=>a+b,0).toFixed(1)+' mm';let c=document.getElementById('chart'),W=c.clientWidth||900,H=300,d=devicePixelRatio||1;c.width=W*d;c.height=H*d;let x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,W,H);let max=Math.max(.5,...vals),L=45,T=15,R=10,B=25,iw=W-L-R,ih=H-T-B;x.strokeStyle='#ddd';x.fillStyle='#65727d';x.font='12px system-ui';for(let i=0;i<5;i++){let y=T+ih*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText((max*(1-i/4)).toFixed(1),4,y+4)}let slot=iw/Math.max(1,vals.length);x.fillStyle='#4c8cae';vals.forEach((z,i)=>x.fillRect(L+i*slot+slot*.15,T+ih-z/max*ih,Math.max(2,slot*.7),z/max*ih));document.getElementById('rows').innerHTML=data.slice(0,24).map(p=>'<tr><td>'+tm(v(p,'date_tm-value'))+'</td><td class="r">'+f(v(p,'rnfl_amt_pst1hr'))+' mm</td><td class="r">'+f(v(p,'rnfl_amt_pst24hrs'))+' mm</td><td class="r">'+f(v(p,'air_temp'))+' °C</td><td class="r">'+(v(p,'wnd_spd_kmh')==null?'—':f(v(p,'wnd_spd_kmh'))+' km/h')+'</td></tr>').join('')}
async function load(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();data=(j.features||[]).map(x=>x.properties||{});if(!data.length)throw Error('No observations');let p=data[0];document.getElementById('r1').textContent=f(v(p,'rnfl_amt_pst1hr'))+' mm';document.getElementById('r24').textContent=f(v(p,'rnfl_amt_pst24hrs'))+' mm';document.getElementById('temp').textContent=f(v(p,'air_temp'))+' °C';document.getElementById('wind').textContent=v(p,'wnd_spd_kmh')==null?'—':f(v(p,'wnd_spd_kmh'))+' km/h';document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString('en-CA')+' • ECCC CWPD • refreshes every 10 minutes';render()}catch(e){document.getElementById('status').textContent='Feed error: '+e.message}}
document.querySelectorAll('button[data-h]').forEach(b=>b.onclick=()=>{hours=+b.dataset.h;document.querySelectorAll('button[data-h]').forEach(q=>q.classList.toggle('active',q===b));render()});load();setInterval(load,600000);addEventListener('resize',render);</script></body></html>
