<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Étape Weather & Rainfall Dashboard</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f3f6f8;color:#18232d}
main{max-width:1100px;margin:auto;padding:20px}h1{margin:0 0 4px}.muted{color:#65727d}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.card,.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 5px #0001}.panel{margin-bottom:18px}
.label{font-size:.82rem;color:#65727d}.value{font-size:1.7rem;font-weight:700;margin-top:5px}
button{border:1px solid #ccd5da;background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer}
button.active{background:#263943;color:#fff}table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e6ebee;text-align:left}th{background:#eef2f4;font-size:.85rem}.right{text-align:right}
canvas{width:100%;height:300px;display:block}.error{color:#a33}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body><main>
<h1>L'Étape Weather & Rainfall</h1>
<div class="muted">Environment and Climate Change Canada — L'Étape (WPD / CWPD)</div>
<div id="status" class="muted">Loading live observations…</div>

<div class="cards">
<div class="card"><div class="label">Rain — previous hour</div><div id="r1" class="value">—</div></div>
<div class="card"><div class="label">Rain — previous 24 hours</div><div id="r24" class="value">—</div></div>
<div class="card"><div class="label">Temperature</div><div id="temp" class="value">—</div></div>
<div class="card"><div class="label">Wind</div><div id="wind" class="value">—</div></div>
</div>

<div class="panel"><h2>Rainfall history</h2>
<div id="buttons" style="display:flex;gap:8px;flex-wrap:wrap">
<button data-h="1">1 hour</button><button data-h="6">6 hours</button>
<button data-h="24" class="active">24 hours</button><button data-h="72">3 days</button><button data-h="168">7 days</button>
</div>
<p id="total" class="muted">—</p><canvas id="chart"></canvas></div>

<div class="panel"><h2>Recent observations</h2>
<table><thead><tr><th>Time</th><th class="right">Rain / 1 hr</th><th class="right">Rain / 24 hr</th><th class="right">Temp.</th><th class="right">Wind</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</main>

<script>
const API="https://taureau-api.davecareytest.workers.dev/";
let data=[],hours=24;

function val(p,k){let x=p?.[k];return x&&typeof x==="object"&&"value"in x?x.value:x??null}
function num(x,d=1){let n=Number(x);return Number.isFinite(n)?n.toFixed(d):"—"}
function time(x){let d=new Date(x);return isNaN(d)?x:d.toLocaleString("en-CA",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function wind(p){
 let s=val(p,"avg_wnd_spd_10m_pst10mts"),d=val(p,"avg_wnd_dir_10m_pst10mts");
 return s==null?"—":num(s,0)+" km/h"+(d!=null?" "+Math.round(Number(d))+"°":"");
}
function rain1(p){return Number(val(p,"pcpn_amt_pst1hr"))}
function validRain(p){let n=rain1(p);return Number.isFinite(n)&&n>=0?n:0}

document.querySelectorAll("#buttons button").forEach(b=>b.onclick=()=>{
 hours=Number(b.dataset.h);
 document.querySelectorAll("#buttons button").forEach(x=>x.classList.toggle("active",x===b));
 render();
});

function draw(rows){
 const c=document.getElementById("chart"),W=c.clientWidth||900,H=300,d=devicePixelRatio||1;
 c.width=W*d;c.height=H*d;
 const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
 if(!rows.length){ctx.fillStyle="#65727d";ctx.fillText("No observations in this period.",20,40);return}
 const a=rows.map(validRain),max=Math.max(.5,...a),L=48,R=15,T=20,B=35,iw=W-L-R,ih=H-T-B;
 ctx.strokeStyle="#dfe5e8";ctx.fillStyle="#65727d";ctx.font="12px system-ui";
 for(let i=0;i<5;i++){let y=T+ih*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillText((max*(1-i/4)).toFixed(1),5,y+4)}
 const slot=iw/a.length,bw=Math.max(2,slot*.7);ctx.fillStyle="#4c8cae";
 a.forEach((v,i)=>{let bh=v/max*ih;ctx.fillRect(L+i*slot+(slot-bw)/2,T+ih-bh,bw,bh)});
}

function render(){
 if(!data.length)return;
 const cutoff=Date.now()-hours*3600000;
 const rows=data.filter(p=>Date.parse(val(p,"date_tm-value"))>=cutoff).slice().reverse();
 const total=rows.reduce((s,p)=>s+validRain(p),0);
 document.getElementById("total").textContent="Rainfall in selected period: "+total.toFixed(1)+" mm";
 draw(rows);

 document.getElementById("rows").innerHTML=data.slice(0,24).map(p=>`
 <tr><td>${time(val(p,"date_tm-value"))}</td>
 <td class="right">${num(val(p,"pcpn_amt_pst1hr"))} mm</td>
 <td class="right">${num(val(p,"pcpn_amt_pst24hrs"))} mm</td>
 <td class="right">${num(val(p,"air_temp"))} °C</td>
 <td class="right">${wind(p)}</td></tr>`).join("");
}

async function load(){
 try{
  const r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw Error("HTTP "+r.status);
  const j=await r.json();
  data=(j.features||[]).map(x=>x.properties||{});
  if(!data.length)throw Error("No observations returned");

  const p=data[0];
  document.getElementById("r1").textContent=num(val(p,"pcpn_amt_pst1hr"))+" mm";
  document.getElementById("r24").textContent=num(val(p,"pcpn_amt_pst24hrs"))+" mm";
  document.getElementById("temp").textContent=num(val(p,"air_temp"))+" °C";
  document.getElementById("wind").textContent=wind(p);
  document.getElementById("status").textContent=
   "Updated "+new Date().toLocaleTimeString("en-CA")+" • "+data.length+" observations loaded • refreshes every 10 minutes";
  document.getElementById("status").className="muted";
  render();
 }catch(e){
  document.getElementById("status").textContent="Feed error: "+e.message;
  document.getElementById("status").className="error";
 }
}
load();setInterval(load,600000);addEventListener("resize",render);
</script></body></html>
